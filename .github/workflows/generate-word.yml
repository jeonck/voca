name: Generate word entry

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      word:
        description: "추가할 영어 단어"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  HUGO_VERSION: 0.140.2

jobs:
  generate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.issue.labels.*.name, 'word-request') &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'COLLABORATOR' ||
          github.event.issue.author_association == 'MEMBER'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Resolve requested word
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_WORD: ${{ github.event.inputs.word }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            WORD="$DISPATCH_WORD"
          else
            WORD="$(echo "$ISSUE_TITLE" | sed -E 's/^\[word\]//I' | xargs)"
          fi
          if [ -z "$WORD" ]; then
            echo "요청된 단어를 찾을 수 없습니다." >&2
            exit 1
          fi
          echo "word=$WORD" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Generate etymology entry with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Bash(git *),Bash(gh *),Bash(hugo *),Bash(ls *),Bash(date *)"
          prompt: |
            너는 Hugo로 만든 "voca" 저장소에 새 영어 단어의 어원 설명을 추가하는 작업을 자동으로 수행한다.

            요청된 단어: "${{ steps.extract.outputs.word }}"
            관련 이슈 번호: ${{ steps.extract.outputs.issue_number }} (비어 있으면 workflow_dispatch로 수동 실행된 것)

            ## 절차

            1. `content/words/` 를 확인해라. `<word>.md` 가 이미 있으면 새 커밋을 만들지 말고,
               이슈 번호가 있으면 "이미 등록된 단어입니다: https://voca.metacog.co.kr/words/<word>/"
               코멘트만 남기고 종료해라.
            2. 기존 항목(예: `content/words/applicant.md`)을 열어 형식과 톤을 파악해라.
               새 파일 `content/words/<word>.md` 를 아래 YAML front matter 스키마로 작성한다:

               ---
               title: "<영어 단어>"
               date: <추가 시각. `date -u +%Y-%m-%dT%H:%M:%S+00:00` 로 지금 시각을 구해 그대로 넣어라>
               ipa: "<발음기호. 미국식 IPA를 슬래시로 감싸 표기. 예: /ˈæplɪkənt/>"
               korean: "<짧은 한국어 뜻>"
               formula: "<예: ad-(~쪽으로) + plic-(접다, 포개다) + -ant(지금 그렇게 하고 있는 사람)>"
               roots:
                 - "<핵심 어근 하나. formula에서 접두사/접미사를 뺀 가운데 어근. 예: plic>"
               paragraphs:
                 - "<어근의 라틴어/그리스어 원형과 의미 설명. 1~3개 문단. **볼드**로 어근 강조 가능>"
               scene: "<한국어 뜻이 아니라 어원이 그리는 구체적인 장면을 1문단으로. '그게 <word>입니다'로 끝나면 좋음>"
               closing: "<사전적 번역이 놓치는 뉘앙스를 짚는 1~2문장>"
               family:
                 - word: "<같은 어근을 가진 관련 단어>"
                   note: "<그 단어의 어원적 그림을 짧게>"
               antonyms:            # 선택. 반대말이 실제로 성립할 때만 넣는다.
                 - word: "<반대말>"
                   note: "<왜 반대인지. 가능하면 어원으로. 예: 같은 sist- 뿌리에 de-가 붙어 '서기를 그만두다'>"
               bridge: "<선택. 두 단어가 어원상 짝을 이루는 통찰이 있을 때만>"
               ---

               (본문 영역은 비워 둔다. 모든 내용은 front matter에 담긴다.)

               규칙:
               - 모든 서술은 한국어로, 기존 항목과 같은 톤을 유지해라.
                 어근의 물리적 동작을 구체적 장면으로 그리고, 사전적 번역은 마지막에 상대화한다.
               - family는 3~5개.
               - `antonyms` 는 마땅한 반대말이 있을 때만 1~3개 넣어라. 없으면 항목 자체를 빼라 —
                 억지로 만들지 마라. photograph·molecule 처럼 반대말이 없는 단어가 실제로 많다.
               - `roots` 는 반드시 소문자 한 개만. 기존 어근과 겹치면 자동으로 함께 묶여 표시된다.
               - `date` 는 목록 정렬(최근 추가 순 내림차순)에 쓰이므로 반드시 넣어야 한다. 빼먹으면 목록 맨 뒤로 밀린다.
               - `ipa` 는 미국식 발음을 기본으로 한다. produce/conduct 처럼 품사에 따라 강세가 옮겨가는 단어라면
                 `/prəˈduːs/ (동사) · /ˈproʊduːs/ (명사)` 처럼 둘 다 적어라. 확실하지 않으면 지어내지 말고
                 가장 널리 쓰이는 한 가지만 적어라.
               - YAML 문자열 안의 큰따옴표는 `\"` 로 이스케이프해라.
               - 사실관계(라틴어/그리스어 어원)가 불확실하면 확실한 범위에서만 서술하고 과장하지 마라.
            3. `hugo --gc --minify` 를 실행해서 빌드가 성공하는지 반드시 확인해라.
               실패하면 front matter 문법을 고쳐서 성공할 때까지 반복해라.
               빌드 후 `public/words/<word>/index.html` 이 생성됐는지도 확인해라.
            4. 새 브랜치(`word/<word>`)를 만들고 `content/words/<word>.md` 만 커밋한 뒤 푸시해라.
               `public/` 과 `resources/` 는 빌드 산출물이므로 절대 커밋하지 마라.
            5. `gh pr create` 로 PR을 열어라. 제목은 `단어 추가: <word>`, 본문에는 추가한 단어와 핵심 어근을 요약하고,
               이슈 번호가 있으면 `Closes #<issue_number>` 를 포함해라.
            6. 이슈 번호가 있으면 `gh issue comment` 로 "PR을 열었습니다: <PR 링크>" 코멘트를 남겨라.

            변경 범위는 `content/words/<word>.md` 파일 하나로 제한해라. 다른 파일은 건드리지 마라.
