<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>voca — 어원으로 보는 영단어</title>
  <meta name="description" content="영단어를 어근으로 분해해서 장면으로 이해하는 어원 학습 사이트" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
</head>
<body>
  <header class="site">
    <h1>voca</h1>
    <p>단어를 한국어 뜻으로 외우지 않고, 어원을 장면으로 이해합니다</p>
  </header>

  <main>
    <section id="list-view" class="active">
      <div class="search-row">
        <input id="search" type="text" placeholder="단어, 뜻, 어근으로 검색 (예: applicant, plic)" />
      </div>
      <div id="root-chips" class="chips"></div>
      <div id="word-list"></div>

      <div class="request-box">
        <a id="request-link" class="btn" href="#" target="_blank" rel="noopener">새 단어 요청하기</a>
        <p>GitHub 이슈로 단어를 요청하면 자동으로 어원 분석이 추가돼요.</p>
      </div>
    </section>

    <section id="detail-view" class="detail">
      <button id="back-btn" class="back-btn">← 목록으로</button>
      <div id="detail-body"></div>
    </section>
  </main>

  <footer class="site">
    <p><a href="https://github.com/jeonck/voca" target="_blank" rel="noopener">GitHub 저장소</a></p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
