baseURL = "https://voca.metacog.co.kr/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "voca — 어원으로 보는 영단어"

# 어근은 소문자 표기가 원칙이므로 목록 제목 자동 대문자화를 끈다.
capitalizeListTitles = false

# 어근(root)별로 단어를 묶어 보여주기 위한 분류 체계
[taxonomies]
  root = "roots"

[params]
  description = "영단어를 어근으로 분해해서 장면으로 이해하는 어원 학습 사이트"
  repo = "jeonck/voca"

[markup.goldmark.renderer]
  # 본문에 쓰인 따옴표·강조 표기를 그대로 살리기 위해 HTML을 허용한다.
  unsafe = true

[markup.goldmark.extensions]
  # “…” 같은 문장부호를 임의로 바꾸지 않도록 타이포그래퍼를 끈다.
  typographer = false

[permalinks]
  words = "/words/:slug/"

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
