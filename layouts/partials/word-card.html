{{/* 단어 카드 하나. 검색/필터를 위해 data-* 속성에 원문을 실어둔다. */}}
{{ $root := index .Params.roots 0 }}
<a class="card"
   href="{{ .RelPermalink }}"
   data-word="{{ .Title | lower }}"
   data-korean="{{ .Params.korean }}"
   data-formula="{{ .Params.formula | lower }}"
   data-root="{{ $root }}">
  <span class="card-root">{{ $root }}-</span>
  <h2 class="card-word">{{ .Title }}</h2>
  <p class="card-korean">{{ .Params.korean }}</p>
  <p class="card-formula">{{ partial "rich.html" (dict "page" .Page "text" .Params.formula) }}</p>
</a>
