<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — voca{{ end }}</title>
  <meta name="description" content="{{ with .Params.korean }}{{ $.Title }}({{ . }})의 어원 풀이. {{ end }}{{ .Site.Params.description }}" />
  {{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
</head>
<body>
  <header class="site">
    <a class="site-title" href="{{ "/" | relURL }}">voca</a>
    <p class="site-tagline">단어를 한국어 뜻으로 외우지 않고, 어원을 장면으로 이해합니다</p>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site">
    <p>
      <a href="https://github.com/{{ .Site.Params.repo }}">GitHub 저장소</a>
      · 총 {{ len (where .Site.RegularPages "Section" "words") }}개 단어
    </p>
  </footer>
</body>
</html>
